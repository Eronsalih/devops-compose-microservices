services:

  frontend:
    build:
      context: ./frontend
    container_name: devops-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./backend/gateway
    container_name: devops-gateway
    ports:
      - "8000:8000"
    environment:
      USERS_SERVICE_URL: http://users-service:8000
      TASKS_SERVICE_URL: http://tasks-service:8000
    depends_on:
      - users-service
      - tasks-service

  users-service:
    build:
      context: ./backend/users-service
    container_name: devops-users-service
    ports:
      - "8001:8000"

  tasks-service:
    build:
      context: ./backend/tasks-service
    container_name: devops-tasks-service
    ports:
      - "8002:8000"
