services:

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/eronsalih/devops-frontend:latest
    container_name: devops-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: ./backend/gateway
    image: ghcr.io/eronsalih/devops-gateway:latest
    container_name: devops-gateway
    ports:
      - "8000:8000"
    environment:
      USERS_SERVICE_URL: http://users-service:8000
      TASKS_SERVICE_URL: http://tasks-service:8000
    depends_on:
      - users-service
      - tasks-service
    restart: unless-stopped

  users-service:
    build:
      context: ./backend/users-service
    image: ghcr.io/eronsalih/devops-users-service:latest
    container_name: devops-users-service
    ports:
      - "8001:8000"
    restart: unless-stopped

  tasks-service:
    build:
      context: ./backend/tasks-service
    image: ghcr.io/eronsalih/devops-tasks-service:latest
    container_name: devops-tasks-service
    ports:
      - "8002:8000"
    restart: unless-stopped