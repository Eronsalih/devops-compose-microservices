name: DevOps Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    name: Build and Push Compose Stack
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set GHCR owner
        run: |
          echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build all services
        run: docker compose build

      - name: Push all images to GHCR
        run: docker compose push
